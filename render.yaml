# Render Blueprint — Module 7F
# https://render.com/docs/blueprint-spec
#
# After deploy:
# 1. Set CORS_ORIGINS to your Vercel URL
# 2. Set PUBLIC_API_URL to this service URL
# 3. Seed: PYTHONPATH=/app:/app/apps/backend python /app/scripts/seed_safety_demo.py

services:
  - type: web
    name: bmw-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: bmw-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_AUTH_WRITES
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bmw-ai-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: bmw-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bmw-ai-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: OLLAMA_BASE_URL
        value: ""
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PYTHONPATH
        value: /app:/app/apps/backend

  - type: redis
    name: bmw-ai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: bmw-ai-db
    plan: free
    databaseName: bmwai
    user: bmwai
