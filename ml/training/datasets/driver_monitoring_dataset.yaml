# Ultralytics YOLO dataset config for Module 1D (phone / smoking / no_seatbelt)
#
# After converting DMD (or a Kaggle distraction dataset) to YOLO format, either:
#   1. Upload this folder layout to Kaggle as dataset "dmd-driver-monitoring", OR
#   2. Point `path:` below to your local absolute dataset root.
#
# Expected layout:
#   <path>/
#     images/train/*.jpg
#     images/val/*.jpg
#     labels/train/*.txt
#     labels/val/*.txt
#
# Each label line:  <class_id> <x_center> <y_center> <width> <height>   (all normalized 0–1)

path: /kaggle/input/dmd-driver-monitoring
train: images/train
val: images/val

nc: 3
names:
  0: phone
  1: smoking
  2: no_seatbelt
