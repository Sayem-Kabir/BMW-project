[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-ai-platform-backend"
version = "0.1.0"
description = "BMW AI Automotive Intelligence Platform backend"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["readme"]
authors = [ { name = "BMW AI Platform" } ]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "sqlalchemy[asyncio]==2.0.35",
  "asyncpg==0.30.0",
  "alembic==1.13.3",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.9",
  "redis==5.0.0",
  "httpx==0.27.0",
  "structlog==24.4.0",
  "ultralytics==8.2.0",
  "opencv-python==4.10.0.84",
  "mediapipe==0.10.9",
  "dlib==19.24.6",
  "numpy==1.24.3",
  "scipy==1.13.0",
  "scikit-image==0.23.2",
  "torch==2.3.0",
  "torchvision==0.18.0",
  "pytorch-grad-cam==1.5.0",
  "captum==0.7.0",
  "shap==0.45.1",
  "xgboost==2.1.1",
  "lightgbm==4.4.0",
  "langchain==0.2.0",
  "langgraph==0.1.0",
  "langchain-community==0.0.24",
  "chromadb==0.5.0",
  "sentence-transformers==3.0.0",
  "pypdf==4.3.1",
  "mlflow==2.14.3",
  "optuna==4.1.1",
  "celery==5.4.0",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "pytest-asyncio==0.24.0"
]
