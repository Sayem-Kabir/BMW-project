[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-ai-platform-frontend"
version = "0.1.0"
description = "BMW AI Automotive Intelligence Platform frontend"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [ { name = "BMW AI Platform" } ]
classifiers = [
  "Framework :: React",
  "Programming Language :: JavaScript",
  "Programming Language :: TypeScript"
]

[project.optional-dependencies]
next = [
  "next@^14.2.0",
  "react@^18.3.1",
  "react-dom@^18.3.1",
  "typescript@^5.4.5"
]
